window.up=path=>pick(d=>{set(path,d);openAdm()},path==="bgImg"||path==="heroImg"?1400:900);
function openAdm(){const A=$("#adm"),T=S.theme,t=S.t;A.style.display="block";
A.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:16px">⚙ Painel ADM</b><button class="g" onclick="$('#adm').style.display='none'">Fechar ✕</button></div>
<h4>Cores e fundo</h4><label>Tamanho do nome da loja: ${t.bs||22}px</label><input type="range" min="14" max="40" value="${t.bs||22}" oninput="set('t.bs',+this.value);this.previousElementSibling.textContent='Tamanho do nome da loja: '+this.value+'px'">
<label>Cor de destaque (dourado)</label><input type="color" value="${T.accent}" oninput="set('theme.accent',this.value)">
<label>Cor escura (topo, banners, rodapé)</label><input type="color" value="${T.dark}" oninput="set('theme.dark',this.value)">
<label>Cor de fundo do site</label><input type="color" value="${T.bg}" oninput="set('theme.bg',this.value)">
<label>Cor do texto</label><input type="color" value="${T.text}" oninput="set('theme.text',this.value)">
${imgF("Imagem de fundo do site","bgImg",S.bgImg)}
<h4>Imagens principais</h4>${imgF("Imagem do banner principal","heroImg",S.heroImg)}<br>${imgF("Imagem da faixa 'Effortless style'","bannerImg",S.bannerImg)}<br>${imgF("Imagem do 'About'","aboutImg",S.aboutImg)}
<h4>Textos</h4>
${[["Nome da loja","brand"],["Subtítulo da logo","tag"],["Barra superior","top"],["Chamada pequena","kicker"],["Título principal","h1"],["Frase cursiva","script"],["Descrição","desc"],["Botão 1","b1"],["Botão 2","b2"],["Título 'Novidades'","newT"],["Sub 'Novidades'","newS"],["Título 'Mais vendidos'","bestT"],["Faixa título","bannerT"],["Faixa subtítulo","bannerS"],["Faixa botão","bannerB"],["Texto 'About'","about"],["E-mail","email"],["Rodapé","foot"],["Moeda (ex: R$)","cur"],["WhatsApp para receber pedidos (só números, ex: 5551999999999)","wa"],["Chave Pix","pix"],["Nome do recebedor Pix (sem acento, até 25 letras)","pixN"],["Cidade do Pix (sem acento, até 15 letras)","pixC"],["Link de pagamento do cartão (Mercado Pago, PagBank, InfinitePay...) - opcional","cardLink"],["Tamanhos (ex: P,M,G,GG)","sizes"],["Cupom de desconto (código, ex: BEMVINDO10)","cupom"],["Cupom: % de desconto (ex: 10)","cupomP"],["Frete (valor; 0 ou vazio = grátis)","frete"],["Frete grátis a partir de (valor)","freteMin"]].map(([l,k])=>inp(l,"t."+k,t[k])).join("")}
<h4>Coleções</h4>${S.cols.map((c,i)=>`<div class="pi">${inp("Nome",`cols.${i}.n`,c.n)}${inp("Descrição",`cols.${i}.d`,c.d)}<label>Cor de fundo</label><input type="color" value="${c.c}" oninput="set('cols.${i}.c',this.value)">${imgF("Imagem",`cols.${i}.img`,c.img)}</div>`).join("")}
<h4>Produtos</h4>${S.prods.map((p,i)=>`<div class="pi"><div class="th" style="background:${p.img?`url('${p.img}') center/cover`:p.c}"></div>${inp("Nome",`prods.${i}.n`,p.n)}${inp("Preço (só número)",`prods.${i}.p`,p.p,"number")}${inp("Preço antigo (promoção, opcional)",`prods.${i}.old`,p.old||"","number")}${inp("Tamanhos deste produto (vazio = padrão da loja)",`prods.${i}.sz`,p.sz||"")}<label><input type="checkbox" ${p.out?"checked":""} onchange="set('prods.${i}.out',this.checked)"> Esgotado</label><label>Seção</label><select onchange="set('prods.${i}.s',this.value);openAdm()"><option value="new" ${p.s==="new"?"selected":""}>Novidades</option><option value="best" ${p.s==="best"?"selected":""}>Mais vendidos</option><option value="acc" ${p.s==="acc"?"selected":""}>Cordões e Joias</option></select><label>Cor (sem foto)</label><input type="color" value="${p.c}" oninput="set('prods.${i}.c',this.value)">${imgF("Foto do produto",`prods.${i}.img`,p.img)}<br><button class="d" onclick="if(confirm('Excluir produto?')){S.prods.splice(${i},1);save();render();openAdm()}">Excluir</button><button class="g" onclick="mv(${i},-1)">↑</button><button class="g" onclick="mv(${i},1)">↓</button><button class="g" onclick="S.prods.splice(${i}+1,0,{...S.prods[${i}]});save();render();openAdm()">Duplicar</button></div>`).join("")}
<button onclick="S.prods.push({n:'Novo produto',p:99,c:'#777',s:'new'});save();render();openAdm()">+ Adicionar produto</button>
<h4>Avaliações</h4>${S.revs.map((r,i)=>`<div class="pi">${inp("Nome",`revs.${i}.n`,r.n)}${inp("Texto",`revs.${i}.t`,r.t)}<button class="d" onclick="S.revs.splice(${i},1);save();render();openAdm()">Excluir</button></div>`).join("")}<button onclick="S.revs.push({n:'Cliente',t:'Ótimo atendimento!'});save();render();openAdm()">+ Adicionar avaliação</button>
<h4>Exportar</h4><p style="font-size:12px;color:#555;margin-bottom:8px">Gera um arquivo .html completo da loja já com tudo o que está agora: produtos, fotos, textos, cores, coleções, avaliações e configurações. Pedidos e inscritos não vão nesse arquivo.</p><button onclick="exportAll()">⬇ Exportar loja completa (.html)</button><button class="g" onclick="exportJson()">Baixar backup (.json, com pedidos)</button>
<h4>Inscritos e backup</h4><label>E-mails inscritos (${S.subs.length})</label><textarea rows="4" readonly>${esc(S.subs.join("\n"))}</textarea><label>Backup da loja (copie e guarde, ou cole aqui para restaurar)</label><textarea id="bk" rows="3"></textarea><button onclick="$('#bk').value=JSON.stringify(S);$('#bk').select()">Gerar backup</button><button class="g" onclick="try{S=JSON.parse($('#bk').value);save();location.reload()}catch(e){alert('Backup inválido')}">Restaurar</button>
<h4>Geral</h4><button class="d" onclick="if(confirm('Restaurar tudo ao padrão?')){S=JSON.parse(JSON.stringify(DEF));save();render();openAdm()}">Restaurar padrão</button>`;tabify()}
let TAB="Visual";const TABS={Visual:["Cores e fundo","Imagens principais","Coleções"],Textos:["Textos","Avaliações"],Produtos:["Produtos"],Pedidos:["Pedidos"],Geral:["Exportar","Geral","Inscritos e backup"]},ICO={Visual:"🎨",Textos:"✏️",Produtos:"👕",Pedidos:"📦",Geral:"⚙"};
function ordersHtml(){const o=S.orders,rev=o.reduce((a,x)=>a+x.total,0);return `<h4>Pedidos</h4><div class="stat"><div><b>${o.length}</b>pedidos</div><div><b>${o.filter(x=>x.st==="Novo").length}</b>novos</div><div><b>${fm(rev)}</b>total</div></div>`+(o.length?o.map((x,i)=>`<div class="pi"><b>#${String(x.id).slice(-5)}</b> · ${esc(x.d)}<br>${esc(x.nm)} · ${esc(x.tel)}<br><small>${esc(x.end)} · ${esc(x.pay)}</small><br>${x.items.map(c=>c.q+"× "+esc(c.n)).join(", ")}<br><b>${fm(x.total)}</b><br><select onchange="S.orders[${i}].st=this.value;save();openAdm()">${["Novo","Aguardando Pix","Pix informado","Pago","Enviado","Entregue","Cancelado"].map(s=>`<option ${s===x.st?"selected":""}>${s}</option>`).join("")}</select><button class="d" onclick="S.orders.splice(${i},1);save();openAdm()">Excluir</button></div>`).join(""):"<p>Nenhum pedido ainda.</p>")}
function tabify(){const A=$("#adm");A.insertAdjacentHTML("beforeend",ordersHtml());[...A.querySelectorAll("h4")].forEach(h=>{const g=document.createElement("div"),els=[];g.className="grp";g.dataset.k=h.textContent;h.before(g);let n=h;while(n&&!(n!==h&&n.tagName==="H4")){els.push(n);n=n.nextSibling}els.forEach(e=>g.appendChild(e))});
const b=document.createElement("div");b.className="tabs";b.innerHTML=Object.keys(TABS).map(k=>`<button data-k="${k}">${ICO[k]} ${k}</button>`).join("");b.onclick=e=>{if(e.target.dataset.k){TAB=e.target.dataset.k;showTab();A.scrollTop=0}};A.firstElementChild.after(b);showTab()}
function showTab(){const A=$("#adm");A.querySelectorAll(".grp").forEach(g=>g.style.display=TABS[TAB].includes(g.dataset.k)?"":"none");A.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x.dataset.k===TAB))}
</script></body></html>
